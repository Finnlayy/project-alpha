# pytest configuration for Projekt:Alpha.
#
# `pythonpath` is REQUIRED, not cosmetic: the test modules import the backend as
# `app.*`, and there is no installed distribution or `__init__.py`-less package
# root on sys.path. Running the bare `pytest` console script (as CI does) does
# NOT put the current directory on sys.path — only `python -m pytest` does. So
# without this setting every test module fails collection with
# "ModuleNotFoundError: No module named 'app'".
#
# `pythonpath` is built into pytest >= 7.0 (requirements.txt pins pytest >= 8.0).
[pytest]
pythonpath = .
testpaths = tests
