# =========================================================
# Projekt:Alpha — local production stack
#   backend  : FastAPI execution engine on :8000
#   frontend : built React dashboard on :3000 (serves dist,
#              proxies /api -> backend)
#   mcp      : MCP server on :4100 (Streamable HTTP transport,
#              exposes all trading/quant/strategy tools to LLM clients)
#
#   docker compose up --build
#   # then open http://localhost:3000
#   # MCP endpoint: http://localhost:4100/mcp
# =========================================================
services:
  backend:
    build: .
    image: alpha-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      - ALPHA_DATA_DIR=/data
    volumes:
      - alpha-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /srv/alpha
    # vite preview serves the built SPA and proxies /api -> backend
    command: sh -c "npm ci && npm run build && npx vite preview --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_PROXY=http://backend:8000
    volumes:
      - .:/srv/alpha:ro
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: node:20-slim
    working_dir: /srv/alpha/mcp-server
    command: sh -c "npm ci && npx tsx src/http-server.ts"
    environment:
      - ALPHA_BACKEND_URL=http://backend:8000
      - MCP_PORT=4100
      - MCP_HOST=0.0.0.0
    volumes:
      - ./mcp-server:/srv/alpha/mcp-server:ro
    ports:
      - "4100:4100"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  alpha-data:
